.panel,.card,.local-banner,.soon{border-radius:var(--vx-petal);border:1px solid rgba(77,255,196,.20);background:radial-gradient(ellipse 70% 72% at 0% 0%,rgba(77,255,196,.105),transparent 70%),radial-gradient(ellipse 65% 75% at 100% 100%,rgba(255,142,107,.065),transparent 70%),linear-gradient(145deg,rgba(17,43,48,.84),rgba(5,18,24,.91) 55%,rgba(7,25,30,.91));box-shadow:inset 0 1px rgba(232,255,250,.10),0 20px 48px -38px rgba(0,0,0,.9),0 0 29px rgba(77,255,196,.035);backdrop-filter:blur(18px)}

.card{overflow:hidden;position:relative;transition:transform .2s,border-color .2s,box-shadow .2s}

.ban{height:115px;background:radial-gradient(ellipse 65% 85% at 9% 0%,color-mix(in srgb,var(--g) 60%,transparent),transparent 85%),radial-gradient(ellipse 75% 100% at 98% 100%,rgba(197,139,255,.25),transparent 90%),linear-gradient(135deg,color-mix(in srgb,var(--g) 20%,#082025),#07161d 78%)}

.ban::after{content:'';position:absolute;top:18px;right:-9%;width:90%;height:120%;border:1px solid rgba(234,255,249,.19);border-radius:50%;transform:rotate(-26deg);box-shadow:0 0 30px color-mix(in srgb,var(--g) 15%,transparent);pointer-events:none}

.cb{padding:17px 20px;gap:17px}.cb h2{font-size:19px}.cf{padding:0 20px 18px}

.btn,.chip,.tab{transition:background .16s,box-shadow .16s,border-color .16s,transform .16s}
.btn{border-radius:17px 6px 17px 6px;padding:10px 15px;background:linear-gradient(150deg,rgba(38,69,74,.8),rgba(12,35,42,.9));border:1px solid rgba(117,210,195,.25)}
.btn:hover{background:rgba(77,255,196,.12);box-shadow:0 0 22px rgba(77,255,196,.09);transform:translateY(-1px)}

.btn.d{background:rgba(255,142,107,.045);border-color:rgba(255,142,107,.34)}

.tabs{border-bottom:1px solid rgba(77,255,196,.14);gap:7px;padding-bottom:7px;scrollbar-width:thin}

.pf-btn{background:linear-gradient(135deg,rgba(45,68,78,.9),rgba(19,33,43,.9));border-color:rgba(122,217,255,.23)}
.pf-btn:hover{border-color:rgba(122,217,255,.5)}
.pf-btn.primary{background:linear-gradient(105deg,#f6ffff,#bcf5ea);box-shadow:0 6px 25px rgba(77,255,196,.12)}
.pf-search{background:rgba(10,29,40,.82);border-color:rgba(122,217,255,.22);border-radius:17px 6px 17px 6px}
.pf-chip{background:rgba(22,37,48,.88);border-color:rgba(122,217,255,.20);color:#d1dce0}
.pf-chip.on{background:linear-gradient(100deg,#f24963,#b23c77);color:white;border-color:transparent}
.pf-section-head h2{font-size:19px;letter-spacing:-.55px}
.pf-poster{border-radius:28px 7px 28px 7px;border:1px solid rgba(122,217,255,.21);box-shadow:inset 0 1px rgba(255,255,255,.12),0 16px 29px -20px #000}
.pf-card:hover .pf-poster,.pf-card:focus-visible .pf-poster{border-color:rgba(242,73,99,.65);box-shadow:0 22px 38px -19px #000,0 0 24px rgba(197,139,255,.14)}
.pf-label{border-radius:12px 4px 12px 4px;background:rgba(7,20,32,.72)}
.pf-overlay{background:rgba(1,6,10,.86);backdrop-filter:blur(18px)}
.pf-dialog{border-radius:38px 11px 38px 11px;border:1px solid rgba(122,217,255,.38);background:radial-gradient(ellipse at 0 0,rgba(77,255,196,.08),transparent 65%),linear-gradient(140deg,#101d28,#0c111b 85%);box-shadow:0 45px 120px rgba(0,0,0,.78),0 0 40px rgba(122,217,255,.05)}
.pf-form input,.pf-form textarea,.pf-form select{border-radius:16px 5px 16px 5px;background:rgba(9,24,35,.84);border-color:rgba(122,217,255,.26)}
.pf-source-form,.pf-fact-list span,.pf-src,.pf-empty{border-radius:30px 9px 30px 9px;border-color:rgba(122,217,255,.24);background:radial-gradient(ellipse 75% 90% at 0% 0%,rgba(77,255,196,.09),transparent 75%),radial-gradient(ellipse 60% 90% at 100% 100%,rgba(242,73,99,.075),transparent 80%),linear-gradient(150deg,rgba(17,34,45,.91),rgba(9,18,30,.92));box-shadow:inset 0 1px rgba(247,255,255,.075)}
.pf-source-form{padding:25px 28px;gap:19px}
.pf-fact-list{gap:12px}.pf-fact-list span{padding:17px}
.pf-settings-head h2{font-size:clamp(26px,3.4vw,40px);letter-spacing:-1.5px}
.pf-settings-grid input,.pf-settings-grid select{border-radius:16px 5px 16px 5px;border-color:rgba(122,217,255,.25);background:rgba(5,20,33,.82)}
.pf-src{border-radius:19px 6px 19px 6px}.pf-episode{border-radius:19px 6px 19px 6px;background:rgba(16,32,43,.86);border-color:rgba(122,217,255,.20)}
.pf-episode:hover{border-color:rgba(242,73,99,.60)}
.pf .pf-footnote{border-top-color:rgba(122,217,255,.14)}
/* Offline preview's actual login – visual design only, auth behavior untouched. */
.preview-login{background:#030b0e;color:#f1fffb}
.preview-hero{background:radial-gradient(ellipse at 20% 0,rgba(77,255,196,.14),transparent 70%),radial-gradient(ellipse at 100% 90%,rgba(197,139,255,.19),transparent 65%),linear-gradient(155deg,#091d23,#030b0e 82%)}
.preview-hero::after{content:'';pointer-events:none;position:absolute;inset:0;background:radial-gradient(ellipse at 75% 0,rgba(122,217,255,.12),transparent 55%);opacity:.9}
.preview-brand{font-weight:900;letter-spacing:-1.2px}
.preview-auth{background:linear-gradient(140deg,#07151b,#030b0e)}
.preview-auth-inner{border:1px solid rgba(77,255,196,.22);background:radial-gradient(ellipse at top left,rgba(77,255,196,.08),transparent 65%),linear-gradient(145deg,rgba(14,38,43,.96),rgba(5,17,22,.97));box-shadow:0 24px 90px rgba(0,0,0,.42);border-radius:40px 11px 40px 11px;padding:clamp(24px,3vw,40px)}
.preview-auth-inner input{border-radius:17px 6px 17px 6px;border-color:rgba(122,217,255,.31);background:rgba(3,14,19,.9)}
.preview-auth-inner button{border-radius:18px 6px 18px 6px}
.preview-demo-tags>div{border-radius:21px 7px 21px 7px!important;backdrop-filter:blur(14px)}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr);gap:0}aside{position:relative;top:0;height:auto;margin:10px 10px 0;border-radius:26px 8px 26px 8px;flex-direction:row;flex-wrap:wrap;gap:4px;padding:15px}.brand{width:100%;padding:2px 10px 8px}.nv{width:auto;min-height:38px;padding:8px 11px}.host{display:none}main{padding:21px 12px 55px;max-width:100vw}.meters{grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}#main:has(.pf){padding:14px 10px 44px}.pf{border-radius:30px 9px 30px 9px}.pf .pf-top{flex-wrap:wrap}.pf-hero{min-height:330px}}
@media(max-width:620px){.panel{padding:16px}.cards{grid-template-columns:1fr}.two,.cols{grid-template-columns:1fr}.pf-source-form{padding:18px}.pf-poster{border-radius:23px 7px 23px 7px}.pf-settings-grid,.pf-fact-list{grid-template-columns:1fr}.preview-auth-inner{padding:22px}.pf-hero-body{padding:44px 21px 28px}.pf .pf-top{gap:7px}.pf-actions{margin-left:0}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card,.btn,.nv,.tab,.pf-poster{transition:none!important}}

}

const PF_GENRES=['Action','Abenteuer','Animation','Anime','Comedy','Dokumentation','Drama','Familie','Fantasy','Horror','Krimi','Mystery','Romantik','Sci-Fi','Thriller','Western'];
const PF_VIDEO_EXT=/\.(mkv|mp4|m4v|webm|avi|mov|wmv|mpg|mpeg|ts)$/i;
const PF_SERIES_RE=/(?:^|[ ._\-])s(\d{1,2})[ ._\-]?e(\d{1,3})(?:\b|[ ._\-])|(?:^|\b)(\d{1,2})x(\d{1,3})(?:\b|[ ._\-])/i;
const PF_YEAR_RE=/(?:\(|\[|\b)((?:19|20)\d{2})(?:\)|\]|\b)/;
function pfFolderTitle(name){return String(name||'').replace(/\.(mkv|mp4|m4v|webm|avi|mov|wmv|mpg|mpeg|ts)$/i,'').replace(PF_SERIES_RE,' ').replace(PF_YEAR_RE,' ').replace(/\b(720p|1080p|2160p|4k|bluray|web-dl|webrip|x264|x265|h264|h265|hevc|german|multi|dts|aac)\b/gi,' ').replace(/[._]+/g,' ').replace(/\s+/g,' ').replace(/[\s\-()[\]]+$/g,'').trim()||'Ohne Titel'}
function pfGuessFolderGenre(parts){let alias={'action':'Action','abenteuer':'Abenteuer','adventure':'Abenteuer','anime':'Anime','comedy':'Comedy','komödie':'Comedy','dokumentation':'Dokumentation','dokumentationen':'Dokumentation','drama':'Drama','fantasy':'Fantasy','horror':'Horror','krimi':'Krimi','mystery':'Mystery','romantik':'Romantik','sci-fi':'Sci-Fi','science fiction':'Sci-Fi','thriller':'Thriller','western':'Western'};for(const p of parts){const g=alias[p.toLowerCase()];if(g)return g}return 'Nicht zugeordnet'}
async function pfParseNfo(file){try{if(file.size>1000000)return {};let t=await file.text();let doc=new DOMParser().parseFromString(t,'application/xml');if(doc.querySelector('parsererror'))return {};const v=k=>doc.querySelector(k)?.textContent?.trim()||'';return {title:v('title'),year:Number(v('year')||v('premiered')?.slice(0,4))||0,genre:v('genre'),description:v('plot')||v('outline')}}catch(_){return {}}}

 const serverForm=pfBackend?`<form id="pfServerSettingsForm" class="pf-source-form"><h3>Ordner auf dem Homeserver</h3><p class="pf-desc">Hier die <b>absoluten Pfade auf Ubuntu</b> angeben. PAULFLIX liest nur diese Ordner und ihre Unterordner.</p>
 <div class="pf-settings-grid"><label>Filmordner <input name="filmPath" placeholder="/srv/media/Filme" value="${pfSafe(pfServerSettings.sources?.find(x=>x.type==='Film')?.path||'')}"></label><label>Serienordner <input name="seriesPath" placeholder="/srv/media/Serien" value="${pfSafe(pfServerSettings.sources?.find(x=>x.type==='Serie')?.path||'')}"></label>
 <label>Prüfintervall <select name="interval">${[5,15,30,60].map(n=>`<option value="${n}" ${pfServerSettings.interval_minutes===n?'selected':''}>Alle ${n} Minuten</option>`).join('')}</select></label>

 return `<section class="pf-settings"><div class="pf-settings-head"><div class="pf-eyebrow">PAULFLIX / MEDIENVERWALTUNG</div><h2>Medienbibliothek einrichten</h2><p>Ordner festlegen, automatisch einlesen und Filme oder Serien richtig zuordnen.</p></div>

 <div class="pf-settings-grid"><label>Ordnerinhalt als <select id="pfFolderType"><option>Auto</option><option>Film</option><option>Serie</option></select></label><div class="pf-scan-action"><input id="pfFolderInput" type="file" webkitdirectory directory multiple style="display:none" aria-label="Medienordner auswählen"><button type="button" class="pf-btn primary" data-pf="folder">📁 Medienordner auswählen und scannen</button></div></div>

async function pfServerApi(path,method='GET',data=null){const csrf=document.querySelector('meta[name="csrf-token"]')?.content||'';const opts={method,credentials:'same-origin',headers:{}};if(method!=='GET')opts.headers['X-CSRF-Token']=csrf;if(data){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(data)}const r=await fetch(path,opts);let value;try{value=await r.json()}catch(_){throw Error('Backend antwortet nicht mit JSON')}if(!r.ok)throw Error(value.error||'Backend-Fehler');return value}
async function pfLoadServer(){if(!pfBackend)return;try{const [settings,catalog]=await Promise.all([pfServerApi('/api/paulflix/settings'),pfServerApi('/api/paulflix/catalog')]);pfServerSettings=settings;pfServerCatalog=catalog;pfServerLoaded=true;pfRefresh()}catch(err){toast('PAULFLIX: '+err.message)}}
async function pfSaveServerSettings(form){try{const fd=new FormData(form),sources=[];if(String(fd.get('filmPath')||'').trim())sources.push({type:'Film',path:String(fd.get('filmPath')).trim()});if(String(fd.get('seriesPath')||'').trim())sources.push({type:'Serie',path:String(fd.get('seriesPath')).trim()});
 await pfServerApi('/api/paulflix/settings','POST',{sources,interval_minutes:Number(fd.get('interval')),auto_scan:fd.has('autoScan')});await pfRescanServer();toast('Medienordner gespeichert und eingelesen.')
 }catch(err){toast('Einstellungen: '+err.message)}}
async function pfRescanServer(){try{await pfServerApi('/api/paulflix/scan','POST');await pfLoadServer();toast('Medienordner eingelesen.')}catch(err){toast('Scan fehlgeschlagen: '+err.message)}}
async function pfScanBrowserFiles(list){const files=[...list],videos=files.filter(x=>PF_VIDEO_EXT.test(x.name));if(!videos.length){toast('Keine unterstützten Videodateien im Ordner gefunden.');return}
 const currentType=document.getElementById('pfFolderType')?.value||'Auto';const filenameMap=new Map(files.filter(f=>/\.(nfo|json)$/i.test(f.name)).map(f=>[f.webkitRelativePath?.toLowerCase()||f.name.toLowerCase(),f]));
 const imageMap=new Map(files.filter(f=>/\.(jpg|jpeg|png|webp)$/i.test(f.name)&&f.size<8*1024*1024).map(f=>[f.webkitRelativePath?.toLowerCase()||f.name.toLowerCase(),f]));
 const coverCache=new Map();
 const folderName=(videos[0].webkitRelativePath||videos[0].name).split('/')[0];const key='folder:'+folderName;const imported=[];const series=new Map();let count=0;
 for(const file of videos.slice(0,2500)){
   const rel=file.webkitRelativePath||file.name,parts=rel.split('/'),episode=PF_SERIES_RE.exec(file.name);
   const isShow=currentType==='Serie'||(currentType==='Auto'&&(!!episode||parts.slice(0,-1).some(q=>/^(serien|series|tv shows|tvshows)$/i.test(q))));
   const folderParts=parts.slice(0,-1),seasonIdx=folderParts.findIndex(q=>/^(s|season|staffel)\s*\d+$/i.test(q));
   const showDir=isShow?(seasonIdx>1?folderParts.slice(0,seasonIdx):folderParts):[];
   const showName=isShow?(showDir.at(-1)||parts.at(-2)||pfFolderTitle(file.name)):'';
   const dirname=parts.slice(0,-1).join('/');const base=file.name.replace(/\.[^.]+$/,'');
   const keys=[dirname+'/'+base+'.nfo',dirname+'/'+base+'.json',dirname+'/movie.nfo',dirname+'/movie.json'];
   if(isShow){keys.unshift(showDir.join('/')+'/tvshow.nfo',showDir.join('/')+'/tvshow.json')}
   let meta={};for(const m of keys){const f=filenameMap.get(m.toLowerCase());if(f){meta=await pfParseNfo(f);if(Object.values(meta).some(Boolean))break}}
   const genre=meta.genre||pfGuessFolderGenre(folderParts),year=meta.year||Number(PF_YEAR_RE.exec(file.name)?.[1]||0),vid='folder-video:'+rel;
   const posterOptions=[dirname+'/'+base+'.jpg',dirname+'/'+base+'.png',dirname+'/poster.jpg',dirname+'/poster.png',dirname+'/folder.jpg',dirname+'/folder.png',showDir.join('/')+'/poster.jpg',showDir.join('/')+'/folder.jpg'];
   let cover=null;
   for(const posterPath of posterOptions){const pic=imageMap.get(posterPath.toLowerCase());if(!pic)continue;
     if(coverCache.has(posterPath))cover=coverCache.get(posterPath);
     else{try{cover=await pfCoverData(pic);coverCache.set(posterPath,cover)}catch(_){cover=null}}
     if(cover)break;
   }
   pfTransientFiles.set(vid,file);count++;
   if(isShow){const sid='folder-show:'+key+':'+showName;
     if(!series.has(sid))series.set(sid,{id:sid,importFolder:key,custom:true,type:'Serie',title:meta.title||pfFolderTitle(showName),year,genre,description:meta.description||'',art:'aurora',cover,duration:'Serie',episodes:[]});
     const sh=series.get(sid);if(sh.genre==='Nicht zugeordnet'&&genre!=='Nicht zugeordnet')sh.genre=genre;
     sh.episodes.push({id:vid,season:Number(episode?.[1]||episode?.[3]||1),episode:Number(episode?.[2]||episode?.[4]||sh.episodes.length+1),title:pfFolderTitle(file.name)});
   }else{imported.push({id:'folder-film:'+rel,videoId:vid,importFolder:key,custom:true,type:'Film',title:meta.title||pfFolderTitle(file.name),year,genre,description:meta.description||'',duration:'Lokale Datei',art:'orion',cover})}
 }
 for(const sh of series.values()){sh.episodes.sort((a,b)=>a.season-b.season||a.episode-b.episode);sh.duration=sh.episodes.length+' Folgen';imported.push(sh)}
 pfCustom=pfCustom.filter(x=>x.importFolder!==key).concat(imported);
 pfStore(PF_KEY,pfCustom);
 const previous=(pfSettings.folders||[]).filter(x=>x.name!==folderName);
 pfSettings.folders=[...previous,{name:folderName,count:imported.length,date:new Date().toLocaleString('de-DE')}];pfStore(PF_SETTINGS_KEY,pfSettings);
 pfRefresh();toast(`${imported.length} Titel eingelesen · ${count} Videodateien erkannt.`);
}

on deinem Browser unterstützt wird.':'Demonstration ohne Filmdatei.'}</p></div>`);
}

 pfModal(`<form class="pf-form" id="pfEditForm" data-mid="${pfSafe(id)}"><div><div class="pf-eyebrow">PAULFLIX · METADATEN</div><h2>Angaben bearbeiten</h2><p class="pf-desc">Automatisch erkannte Angaben bei Bedarf korrigieren.</p></div>

rimary" type="submit" id="pfAddSubmit">＋ Zur Bibliothek hinzufügen</button><button class="pf-btn" type="button" data-pf="close">Abbrechen</button></div></form>`,true)}

// Blob storage uses IndexedDB and works offline in browsers that permit storage for file://.
let pfDBPromise=null;
function pfDB(){if(pfDBPromise)return pfDBPromise;pfDBPromise=new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(new Error('Browser-Speicher nicht verfügbar'));
 const r=indexedDB.open('VitaluxPaulflixLocalFiles',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('Browser-Speicher nicht verfügbar'))});return pfDBPromise}
async function pfPutFile(id,file){const db=await pfDB();return new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(file,id);tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error||new Error('Speicherfehler'));tx.onabort=()=>rej(tx.error||new Error('Speichervorgang abgebrochen'))})}
async function pfGetFile(id){try{const db=await pfDB();return await new Promise((res,rej)=>{const tx=db.transaction('files','readonly');const req=tx.objectStore('files').get(id);req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}catch(_){return null}}
async function pfDeleteFile(id){try{const db=await pfDB();await new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(_){}}
async function pfCoverData(file){if(!file)return null;if(file.size>12*1024*1024)throw new Error('Coverbild zu groß (max. 12 MB).');return new Promise((resolve,reject)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{try{const can=document.createElement('canvas');const ratio=Math.min(1,700/img.width,1050/img.height);can.width=Math.max(1,Math.round(img.width*ratio));can.height=Math.max(1,Math.round(img.height*ratio));can.getContext('2d').drawImage(img,0,0,can.width,can.height);const data=can.toDataURL('image/jpeg',.72);URL.revokeObjectURL(url);resolve(data)}catch(e){URL.revokeObjectURL(url);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Coverbild nicht lesbar'))};img.src=url})}
async function pfSaveVideoForId(id,file){if(!file||!file.size)return false;const prev=pfObjectUrls.get(id);if(prev)URL.revokeObjectURL(prev);pfTransientFiles.set(id,file);pfObjectUrls.set(id,URL.createObjectURL(file));if(file.size>100*1024*1024)return false;
 try{await pfPutFile(id,file);return true}catch(_){return false}}
async function pfImport(form){if(pfSaving)return;const fd=new FormData(form),file=fd.get('video'),title=String(fd.get('title')||'').trim();if(!title||!(file instanceof File)||file.size===0){toast('Bitte Titel und Videodatei wählen.');return}
 pfSaving=true;const btn=document.getElementById('pfAddSubmit');if(btn){btn.disabled=true;btn.textContent='Film wird hinzugefügt …'};
 try{const coverFile=fd.get('cover');const cover=coverFile instanceof File&&coverFile.size?await pfCoverData(coverFile):null;const id='pf-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
 const m={id,custom:true,title:title.slice(0,90),type:fd.get('type')==='Serie'?'Serie':'Film',year:Math.min(2100,Math.max(1900,Number(fd.get('year'))||2026)),genre:String(fd.get('genre')||'Andere'),description:String(fd.get('description')||'').slice(0,700),duration:'Eigene Datei',cover,art:String(fd.get('art')||'orion')};
 const ok=pfSaveVideoForId(id,file);pfCustom.push(m);const metaSaved=pfStore(PF_KEY,pfCustom);const persisted=await ok;
 pfClose();pfRefresh();toast(persisted?'Film gespeichert und zur Bibliothek hinzugefügt.':(metaSaved?'Film hinzugefügt – Datei nur für diese Sitzung verfügbar.':'Film hinzugefügt, Browser-Speicher nicht verfügbar.'));
 }catch(err){toast('Import fehlgeschlagen: '+err.message)}finally{pfSaving=false}}

async function pfPlay(id){const [movieId,episodeId]=id.split('|');const movie=pfGet(movieId);if(!movie)return;
 const vid=episodeId||movie.videoId||movie.episodes?.[0]?.id||movieId;
 let url=pfObjectUrls.get(vid);let videoFile=null;
 if(!url&&movie.serverMedia){url='/api/paulflix/stream/'+encodeURIComponent(vid)}
 if(!url&&pfTransientFiles.has(vid)){url=URL.createObjectURL(pfTransientFiles.get(vid));pfObjectUrls.set(vid,url)}
 if(!url){videoFile=await pfGetFile(vid);if(videoFile instanceof Blob){url=URL.createObjectURL(videoFile);pfObjectUrls.set(vid,url)}}
 if(!url){toast('Bitte zuerst eine eigene Videodatei zuordnen.');pfDetail(movieId);return}
 pfModal(`<div class="pf-player"><div class="pf-player-bar"><strong>▶ ${pfSafe(movie.title)}</strong><span style="font-size:11px;color:#b6b6c2">Lokale Wiedergabe · PAULFLIX</span></div><video id="pfVideo" controls playsinline preload="metadata" aria-label="Videoplayer für ${pfSafe(movie.title)}"></video><div class="pf-player-bar"><span style="font-size:11px;color:#a8aeba">Fortschritt wird lokal gespeichert. Vollbild und Untertitel über die Player-Steuerung.</span><button type="button" data-pf="close" class="pf-btn">Schließen</button></div></div>`);
 const player=document.getElementById('pfVideo');pfCurrentPlayer=movieId;player.src=url;
 player.addEventListener('loadedmetadata',()=>{const p=pfProgress[vid];if(p&&p.time>7&&p.time<player.duration-4)player.currentTime=p.time});
 let last=0;player.addEventListener('timeupdate',()=>{const now=Date.now();if(now-last<2300)return;last=now;if(isFinite(player.duration)&&player.duration>0){pfProgress[vid]={time:player.currentTime,duration:player.duration,updated:now};pfStore(PF_PROGRESS_KEY,pfProgress)}});
 player.addEventListener('pause',()=>{if(isFinite(player.duration)&&player.duration>0){pfProgress[vid]={time:player.currentTime,duration:player.duration,updated:Date.now()};pfStore(PF_PROGRESS_KEY,pfProgress)}});
 player.addEventListener('ended',()=>{pfProgress[vid]={time:0,duration:player.duration||0,updated:Date.now()};pfStore(PF_PROGRESS_KEY,pfProgress)});
 player.addEventListener('error',()=>toast('Dieses Videoformat wird vom Browser nicht unterstützt. MP4 (H.264) oder WebM ausprobieren.'));
 player.play().catch(()=>{});
}
async function pfAttach(id,file){if(!(file instanceof File)||file.size===0)return;const persisted=await pfSaveVideoForId(id,file);toast(persisted?'Videodatei verknüpft und lokal gespeichert.':'Videodatei bis zum nächsten Neuladen verknüpft.');pfDetail(id)}
async function pfRemove(id){const m=pfGet(id);if(!m?.custom)return;if(!confirm('„'+m.title+'“ aus PAULFLIX entfernen? Die gespeicherte Browser-Kopie wird gelöscht.'))return;pfCustom=pfCustom.filter(x=>x.id!==id);pfStore(PF_KEY,pfCustom);pfWatch.delete(id);pfStore(PF_LIST_KEY,[...pfWatch]);delete pfProgress[id];pfStore(PF_PROGRESS_KEY,pfProgress);await pfDeleteFile(id);if(pfObjectUrls.has(id)){URL.revokeObjectURL(pfObjectUrls.get(id));pfObjectUrls.delete(id)}pfTransientFiles.delete(id);pfClose();pfRefresh();toast('Film aus PAULFLIX entfernt.')}
// Dedicated namespaced event handlers, so existing Vitalux actions are unaffected.
document.addEventListener('click',e=>{const el=e.target.closest('[data-pf]');if(!el)return;e.preventDefault();const data=el.getAttribute('data-pf');const n=data.indexOf(':'),cmd=n<0?data:data.slice(0,n),id=n<0?'':data.slice(n+1);
 if(cmd==='tab'){pfTab=id;pfGenre='Alle';pfQuery='';pfRefresh();if(pfBackend&&(!pfServerLoaded||id==='settings'))pfLoadServer()}
 else if(cmd==='genre'){pfGenre=id;pfRefresh()}
 else if(cmd==='folder')document.getElementById('pfFolderInput')?.click();else if(cmd==='rescan')pfRescanServer();else if(cmd==='add')pfAdd();else if(cmd==='edit')pfEdit(id);else if(cmd==='detail')pfDetail(id);else if(cmd==='play')pfPlay(id);
 else if(cmd==='watch')pfWatchToggle(id);else if(cmd==='attach'){document.getElementById('pfAttachInput')?.click()}else if(cmd==='delete')pfRemove(id);
 else if(cmd==='close')pfClose();
});
document.addEventListener('input',e=>{if(e.target.id==='pfSearch'){pfQuery=e.target.value;pfRefresh(true)}});
document.addEventListener('change',e=>{if(e.target.id==='pfSort'){pfSort=e.target.value;pfRefresh()}else if(e.target.id==='pfFolderInput'){if(e.target.files?.length)pfScanBrowserFiles(e.target.files)}else if(e.target.id==='pfAttachInput'){const id=document.querySelector('#pfModal [data-pf^="attach:"]')?.dataset.pf.slice(7);if(id&&e.target.files?.[0])pfAttach(id,e.target.files[0])}});
document.addEventListener('submit',e=>{if(e.target.id==='pfAddForm'){e.preventDefault();pfImport(e.target)}else if(e.target.id==='pfEditForm'){e.preventDefault();pfSaveEdit(e.target)}else if(e.target.id==='pfServerSettingsForm'){e.preventDefault();pfSaveServerSettings(e.target)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('pfModal')){pfClose();e.preventDefault()}});
document.addEventListener('click',e=>{if(e.target?.id==='pfModal')pfClose()});
// Real homeserver only: refresh the indexed media catalog when PAULFLIX is opened.
window.addEventListener('hashchange',()=>{if(pfBackend&&location.hash.slice(1)==='paulflix'&&!pfServerLoaded)pfLoadServer()});
if(pfBackend&&location.hash.slice(1)==='paulflix')pfLoadServer();
if(pfBackend)setInterval(()=>{if(location.hash.slice(1)==='paulflix'&&pfServerLoaded)pfLoadServer()},60000);


render();
</script></body></html>
